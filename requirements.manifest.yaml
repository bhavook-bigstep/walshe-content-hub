# requirements.manifest.yaml
#
# Machine-readable sidecar to /REQUIREMENTS.md (the governed human source of truth).
# It maps each acceptance item (AC#) -> the test node-ids that PROVE it, grouped by suite
# (api = pytest, web = vitest, e2e = Playwright), plus its priority tier.
#
# This is the ONLY hand-edited AC<->test link in the repo. Two scripts consume it:
#   * scripts/acceptance_matrix.py      reads this + the three machine test reports and emits
#                                       met / partial / missing per AC (and reds the build on
#                                       any unproven AC with --check). This is how the spec
#                                       *governs*.
#   * scripts/check_requirements_sync.py asserts this manifest covers EXACTLY the AC set defined
#                                       in /REQUIREMENTS.md (no orphan, no missing) so the spec
#                                       and its proof map can never silently diverge.
#
# Governance decision behind this file: docs/brainstorms/2026-10-01-governing-requirements-file.md
# (Approach D) -> implementation plan §1. Editing scope means editing /REQUIREMENTS.md first.
version: 1
spec: REQUIREMENTS.md
